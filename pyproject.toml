[project]
name = "fccl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "plotly==7.1.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "seaborn==0.13.2",
    "streamlit==1.66.1",
]

[project.scripts]
fccl = "fccl:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"
